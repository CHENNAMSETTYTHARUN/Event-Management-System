# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = alembic

# sys.path path, used to find modules
prepend_sys_path = .

# database URL (Alembic env.py will load it dynamically from settings instead)
sqlalchemy.url = mysql+pymysql://root:root123@127.0.0.1:3306/event_management

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s [%(levelname)-5.5s] [%(name)s] %(message)s
datefmt = %H:%M:%S
